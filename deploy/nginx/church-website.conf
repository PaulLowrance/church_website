# nginx site config for the Church Website
# Copy to /etc/nginx/sites-available/church-website and symlink into
# /etc/nginx/sites-enabled/. Replace server_name with the dev domain (or IP).
# Note: proxy_pass targets have NO trailing slash so the /api, /uploads and
# /podcast/rss prefixes are preserved (FastEndpoints routes include them).

server {
    listen 80;
    listen [::]:80;
    server_name dev.bhpbc.org;

    root /opt/church-website/app;
    index index.html;

    # Allow large podcast audio uploads (matches Podcast:MaxAudioBytes = 500 MB)
    client_max_body_size 600M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Podcast RSS feed (served by the API, not the frontend)
    location /podcast/rss {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded audio / images / transcripts (served by the API)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}