<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256">
  <!-- Built-in 16px Safe Area Padding (Section 6) -->
  <g transform="translate(16, 16)">
    <!-- Communion Emblem Group -->
    <g transform="translate(24, 16)">
      <!-- Unleavened Bread / Loaf (Taupe #b08a7c) -->
      <path d="M 20,130 Q 70,85 120,130 C 130,150 10,150 20,130 Z" fill="#b08a7c" opacity="0.9"/>
      <!-- Score lines on bread -->
      <path d="M 45,118 Q 55,108 65,122" stroke="#f7f3ec" stroke-width="3" fill="none"/>
      <path d="M 75,112 Q 85,102 95,118" stroke="#f7f3ec" stroke-width="3" fill="none"/>

      <!-- Stemmed Communion Chalice (Burgundy Accent #6f2e2a) -->
      <!-- Chalice Bowl -->
      <path d="M 90,30 L 170,30 C 170,80 145,100 130,100 C 115,100 90,80 90,30 Z" fill="#6f2e2a"/>
      <!-- Chalice Rim / Surface Accent -->
      <ellipse cx="130" cy="30" rx="40" ry="8" fill="#b08a7c"/>
      <!-- Chalice Stem & Knop -->
      <rect x="125" y="100" width="10" height="40" fill="#6f2e2a"/>
      <circle cx="130" cy="118" r="9" fill="#6f2e2a"/>
      <!-- Chalice Base / Foot -->
      <path d="M 100,152 L 160,152 L 150,140 L 110,140 Z" fill="#6f2e2a"/>
    </g>

    <!-- Church Name Wordmark -->
    <text x="210" y="88" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="52" 
          font-weight="bold" 
          fill="#6f2e2a" 
          letter-spacing="0.5">BRENTWOOD HILLS</text>

    <text x="210" y="142" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="34" 
          font-weight="normal" 
          fill="#1c1a17" 
          letter-spacing="1">PRIMITIVE BAPTIST CHURCH</text>

    <!-- <text x="210" y="182"  -->
    <!--       font-family="'Helvetica Neue', Arial, sans-serif"  -->
    <!--       font-size="22"  -->
    <!--       font-weight="500"  -->
    <!--       fill="#b08a7c"  -->
    <!--       letter-spacing="2.5">FORT WORTH, TEXAS</text> -->
  </g>
</svg>
